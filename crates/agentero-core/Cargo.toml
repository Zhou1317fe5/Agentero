[package]
name = "agentero-core"
# Keep in lockstep with the `agentero` / `agentero-cli` versions: `core::http`
# bakes `CARGO_PKG_VERSION` into the product User-Agent string.
version = "0.9.4"
edition = "2021"
description = "Tauri-independent foundations of Agentero (errors, fs, http, paths, sqlite, usage log)"
authors = ["you"]
license = "MIT"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# `fs` for the async VaultFs local backend; `rt` for `blocking::run_blocking`
# (tokio's blocking pool — tauri's async runtime is itself tokio-backed).
tokio = { workspace = true, features = ["fs", "rt"] }
# Per-task CancellationToken for the background-task registry.
tokio-util = { version = "0.7", default-features = false }
dirs = { workspace = true }
log = { workspace = true }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "multipart", "cookies"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
async-trait = "0.1.91"
# `error::ApiResult` derives `specta::Type` for the IPC contract; specta is
# lightweight and pulls in no wry/tao/tauri.
specta = { version = "2.0.0-rc.22", features = ["derive"] }
which = "7"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "fs"] }
# Unique temp-dir names in `fs::path` tests.
uuid = { version = "1", features = ["v4"] }

# `http::system_proxy_url` reads the WinINET proxy config (HKCU) on Windows;
# target deps do not transfer from the `agentero` crate, so declare it here too.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
